<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7ed"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.json"><title>歴史探検クエスト</title><style>
*{box-sizing:border-box}body{margin:0;background:#fffaf4;color:#382d25;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}button,input{font:inherit}button{border:0;cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:82px}.top{padding:18px 18px 10px;position:sticky;top:0;background:rgba(255,250,244,.94);backdrop-filter:blur(10px);z-index:5}.brand{font-size:24px;font-weight:900}.sub{color:#8b7768;font-size:13px;margin-top:3px}.screen{display:none;padding:12px 16px 24px}.screen.active{display:block}.card{background:white;border:1px solid #f0dfd1;border-radius:22px;padding:18px;box-shadow:0 5px 18px rgba(90,50,20,.07);margin:12px 0}.hero{text-align:center;padding:26px 18px}.animal{font-size:64px;line-height:1}.btn{width:100%;padding:15px 16px;border-radius:16px;background:#8b5e3c;color:#fff;font-weight:800;margin:7px 0;box-shadow:0 4px 0 #67432b}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #67432b}.btn.alt{background:#f2e4d6;color:#5e4635;box-shadow:none}.btn.green{background:#6d8b55;box-shadow:0 4px 0 #4f683e}.btn.pink{background:#d78391;box-shadow:0 4px 0 #a85f6a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.era{padding:17px 12px;border-radius:18px;background:#fff;border:1px solid #ead9ca;text-align:left;font-weight:900;color:#4c392d}.era small{display:block;color:#9a8272;font-weight:500;margin-top:4px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff3e7;border-radius:15px;padding:11px;text-align:center}.stat b{font-size:20px;display:block}.question{font-size:21px;line-height:1.65;font-weight:900;margin:16px 0}.choice{background:#fff;border:2px solid #eadbcf;border-radius:16px;padding:14px;text-align:left;width:100%;margin:6px 0;font-weight:700;color:#40352e}.choice.correct{border-color:#6d9b63;background:#edf8e9}.choice.wrong{border-color:#d88989;background:#fff0f0}.choice:disabled{cursor:default}.feedback{padding:14px;border-radius:16px;background:#fff7e8;margin-top:12px;line-height:1.65}.tag{display:inline-block;background:#f3e4d7;color:#795a45;border-radius:999px;padding:4px 9px;font-size:12px;margin-right:4px}.progress{height:9px;background:#eee2d7;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:#d88967;border-radius:99px}.ruby{line-height:1.1}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);border-top:1px solid #eaded4;display:flex;justify-content:center;z-index:10}.nav button{background:none;padding:12px 20px;color:#766355;font-size:12px;font-weight:800}.nav span{display:block;font-size:22px}.name{width:100%;padding:14px;border:2px solid #eadbcf;border-radius:14px;margin:10px 0}.partner{display:flex;align-items:center;gap:15px}.partner .animal{font-size:54px}.pill{display:inline-block;padding:5px 10px;border-radius:99px;background:#eaf1df;color:#4d693b;font-weight:800;font-size:12px}.tiny{font-size:12px;color:#8c796b;line-height:1.6}.hints{font-size:13px;color:#725f51}.fill{width:100%;padding:15px;border:2px solid #e6d6c9;border-radius:15px;margin:8px 0}.haniwa{font-size:72px;text-align:center;margin:4px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.question{font-size:19px}.card{padding:15px}.top{padding-top:14px}}
</style></head><body><div class="app"><header class="top"><div class="brand">🏺 歴史探検クエスト</div><div class="sub">旧石器から飛鳥まで・入試対策</div></header>
<section id="playerScreen" class="screen active"><div class="card hero"><div class="animal">🐧</div><h2>だれが挑戦する？</h2><p class="tiny">2人分の学習データを別々に保存できます。</p><div class="two"><button class="btn" onclick="setupPlayer('p1')">プレイヤー1</button><button class="btn green" onclick="setupPlayer('p2')">プレイヤー2</button></div></div></section>
<section id="setupScreen" class="screen"><div class="card"><h2>探検家を登録</h2><input id="nameInput" class="name" placeholder="名前を入力"><p>相棒を選ぼう</p><div class="grid"><button class="era" onclick="chooseStarter('🐧')">🐧 ペンギン</button><button class="era" onclick="chooseStarter('🦥')">🦥 ナマケモノ</button><button class="era" onclick="chooseStarter('🐦')">🐦 シマエナガ</button></div><button class="btn" onclick="finishSetup()">この設定で始める</button></div></section>
<section id="homeScreen" class="screen"><div id="home"></div></section>
<section id="eraScreen" class="screen"><div class="card"><h2 id="eraTitle">時代</h2><div id="eraButtons" class="grid"></div></div></section>
<section id="quizScreen" class="screen"><div class="card"><div id="quizMeta"></div><div id="quizProgress" class="progress"><i></i></div><div id="quizArea"></div></div></section>
<section id="yearScreen" class="screen"><div class="card"><h2>📅 年号トレーニング</h2><div id="yearArea"></div></div></section>
<section id="backupScreen" class="screen"><div class="card"><h2>⚙️ データ管理</h2><p>スマホを変える・アプリを更新する前にバックアップしておくと安心です。</p><button class="btn" onclick="exportData()">📦 学習データを書き出す</button><input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(event)"><button class="btn alt" onclick="document.getElementById('importFile').click()">📥 学習データを読み込む</button><button class="btn pink" onclick="switchPlayer()">👤 プレイヤーを切り替える</button></div></section>
<nav class="nav"><button onclick="showScreen('homeScreen')"><span>🏠</span>ホーム</button><button onclick="openEras()"><span>📚</span>時代</button><button onclick="startRandom()"><span>🎲</span>ランダム</button><button onclick="openYear()"><span>📅</span>年号</button><button onclick="showScreen('backupScreen')"><span>⚙️</span>設定</button></nav></div>
<script src="questions.js"></script><script>
const KEY='rekishi_tanken_v6';let state,currentPlayerId=null,setupId=null,starter='🐧',quiz={items:[],index:0,score:0,answered:false};
const today=()=>new Date().toISOString().slice(0,10);const addDays=(d,n)=>{let x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
function blank(){return{configured:false,name:'',starter:'🐧',xp:0,total:0,correct:0,streak:0,lastAnswerDate:'',recent:[],usedYear:[],usedKanji:[],reviews:{},eraStats:{},cleared:{}}}
function fresh(){return{players:{p1:blank(),p2:blank()}}}
function load(){try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){state=null}if(!state)state=fresh();['p1','p2'].forEach(k=>{if(!state.players[k])state.players[k]=blank()});localStorage.setItem(KEY,JSON.stringify(state))}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function p(){return currentPlayerId?state.players[currentPlayerId]:null}
function showScreen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}
function setupPlayer(id){setupId=id;const q=state.players[id];if(q.configured){currentPlayerId=id;renderHome();showScreen('homeScreen')}else{document.getElementById('nameInput').value='';starter='🐧';showScreen('setupScreen')}}
function chooseStarter(x){starter=x;document.querySelectorAll('.era').forEach(b=>b.style.outline='');event.currentTarget.style.outline='3px solid #d88967'}
function finishSetup(){let n=document.getElementById('nameInput').value.trim()||('探検家'+(setupId==='p1'?'1':'2'));let q=state.players[setupId];q.configured=true;q.name=n;q.starter=starter;currentPlayerId=setupId;save();renderHome();showScreen('homeScreen')}
function renderHome(){let q=p();let acc=q.total?Math.round(q.correct/q.total*100):0;let eras=[...new Set(QUESTION_BANK.map(x=>x.era))];let cleared=eras.filter(e=>q.cleared[e]).length;document.getElementById('home').innerHTML=`<div class="card"><div class="partner"><div class="animal">${q.starter}</div><div><h2>${esc(q.name)}さんの探検基地</h2><span class="pill">Lv.${1+Math.floor(q.xp/100)}</span> <span class="pill">${q.xp} XP</span></div></div></div><div class="stats"><div class="stat"><b>${q.total}</b>回答</div><div class="stat"><b>${acc}%</b>正答率</div><div class="stat"><b>${q.streak}</b>連続</div></div><div class="card"><h3>🗺️ 探検の進み具合</h3><div class="progress"><i style="width:${Math.round(cleared/eras.length*100)}%"></i></div><p class="tiny">${cleared}/${eras.length}時代クリア</p></div><div class="card"><h3>今日やるなら</h3><button class="btn" onclick="startRandom(10)">🎲 ランダム10問</button><button class="btn green" onclick="startReview()">🔁 復習問題</button><button class="btn alt" onclick="openEras()">📚 時代を選ぶ</button></div>`}
function openEras(){let eras=[...new Set(QUESTION_BANK.map(x=>x.era))];document.getElementById('eraButtons').innerHTML=eras.map(e=>{let n=QUESTION_BANK.filter(x=>x.era===e).length;return `<button class="era" onclick="startEra('${e}')">${e}<small>${n}問</small></button>`}).join('');showScreen('eraScreen')}
function startEra(e){let arr=shuffle(QUESTION_BANK.filter(x=>x.era===e));let n=prompt(`${e}：何問やる？\n5 / 10 / 20 / 30 / 全部`,'10');if(n===null)return;let count=n==='全部'?arr.length:Math.min(parseInt(n)||10,arr.length);startQuiz(arr.slice(0,count),e)}
function startRandom(n=10){startQuiz(shuffle([...QUESTION_BANK]).slice(0,n),'ランダム')}
function startReview(){let q=p();let due=QUESTION_BANK.filter(x=>{let d=q.reviews[x.id];return d&&d<=today()});if(!due.length){alert('今日の復習問題はありません。いい調子！');return}startQuiz(shuffle(due).slice(0,20),'今日の復習')}
function startQuiz(items,title){quiz={items,index:0,score:0,answered:false,title};showScreen('quizScreen');renderQuiz()}
function renderQuiz(){let q=quiz.items[quiz.index];if(!q){finishQuiz();return}document.getElementById('quizMeta').innerHTML=`<span class="tag">${quiz.title}</span><span class="tag">Lv.${q.level}</span> <span class="tag">${quiz.index+1}/${quiz.items.length}</span>`;document.querySelector('#quizProgress i').style.width=(quiz.index/quiz.items.length*100)+'%';let body='';if(q.illustration==='haniwa')body+='<div class="haniwa">🗿</div>';body+=`<div class="question">${q.question}</div>`;if(q.type==='fill'){body+=`<input id="fillAnswer" class="fill" placeholder="答えを入力"><button class="btn" onclick="submitFill()">答える</button>`}else{body+=shuffle(q.choices).map(c=>`<button class="choice" onclick="submitChoice(this,${JSON.stringify(c)})">${esc(c)}</button>`).join('')}document.getElementById('quizArea').innerHTML=body}
function submitChoice(btn,c){if(quiz.answered)return;quiz.answered=true;let q=quiz.items[quiz.index];document.querySelectorAll('.choice').forEach(b=>b.disabled=true);let ok=c===q.answer;btn.classList.add(ok?'correct':'wrong');feedback(ok,q)}
function normalize(s){return String(s).trim().replace(/\s/g,'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xfee0))}
function submitFill(){if(quiz.answered)return;let q=quiz.items[quiz.index],v=normalize(document.getElementById('fillAnswer').value);let ok=q.answers.some(a=>normalize(a)===v);quiz.answered=true;feedback(ok,q)}
function feedback(ok,q){if(ok)quiz.score++;let area=document.getElementById('quizArea');area.insertAdjacentHTML('beforeend',`<div class="feedback"><b>${ok?'⭕ 正解！':'❌ ここは確認！'}</b><br>正解：<strong>${esc(q.answer||q.answers[0])}</strong><p>${esc(q.explanation)}</p><button class="btn ${ok?'green':'pink'}" onclick="nextQ(${ok})">${quiz.index+1===quiz.items.length?'結果を見る':'次の問題へ'}</button></div>`);record(q,ok)}
function record(q,ok){let s=p();s.total++;if(ok){s.correct++;s.xp+=10;let d=s.reviews[q.id]||today();let next;if(!s.reviews[q.id])next=addDays(today(),3);else{let diff=Math.max(1,Math.round((new Date(d)-new Date(today()))/86400000));next=addDays(today(),Math.min(diff*2,30))}s.reviews[q.id]=next}else{s.xp+=2;s.reviews[q.id]=addDays(today(),1)}s.recent.unshift({id:q.id,ok,date:today()});s.recent=s.recent.slice(0,50);if(s.lastAnswerDate===addDays(today(),-1))s.streak++;else if(s.lastAnswerDate!==today())s.streak=1;s.lastAnswerDate=today();let e=s.eraStats[q.era]||{n:0,c:0};e.n++;if(ok)e.c++;s.eraStats[q.era]=e;if(e.n>=Math.min(10,QUESTION_BANK.filter(x=>x.era===q.era).length)&&e.c/e.n>=.7)s.cleared[q.era]=true;save()}
function nextQ(){quiz.index++;quiz.answered=false;renderQuiz()}
function finishQuiz(){let pct=Math.round(quiz.score/quiz.items.length*100);document.getElementById('quizMeta').innerHTML='';document.getElementById('quizProgress i').style.width='100%';document.getElementById('quizArea').innerHTML=`<div class="hero"><div class="animal">${pct>=80?'🏆':pct>=60?'🌟':'💪'}</div><h2>探検終了！</h2><p><strong>${quiz.score} / ${quiz.items.length}問</strong><br>正答率 ${pct}%</p><button class="btn" onclick="renderHome();showScreen('homeScreen')">ホームへ戻る</button><button class="btn alt" onclick="startRandom(10)">もう10問やる</button></div>`}
function openYear(){document.getElementById('yearArea').innerHTML='<button class="btn" onclick="yearQuiz()">年号→できごと 10問</button><button class="btn green" onclick="yearReverse()">できごと→年号 10問</button><div class="tiny">538/552説など、教科書で扱われる代表年を中心に出題します。</div>';showScreen('yearScreen')}
function yearQuiz(){let a=shuffle(YEAR_BANK).slice(0,10);let qs=a.map((x,i)=>({id:'year_'+i+'_'+x[0],era:'年号',type:'choice',question:`${x[0]}年のできごとは？`,choices:shuffle([x[1],...shuffle(YEAR_BANK.filter(y=>y[1]!==x[1])).slice(0,3).map(y=>y[1])]),answer:x[1],explanation:`${x[0]}年：${x[1]}`,level:2}));startQuiz(qs,'年号')}
function yearReverse(){let a=shuffle(YEAR_BANK).slice(0,10);let qs=a.map((x,i)=>({id:'yr_'+i+'_'+x[0],era:'年号',type:'choice',question:`「${x[1]}」は何年？`,choices:shuffle([x[0],...shuffle(YEAR_BANK.filter(y=>y[0]!==x[0])).slice(0,3).map(y=>y[0])]),answer:x[0],explanation:`${x[1]}＝${x[0]}年`,level:2}));startQuiz(qs,'年号')}
function switchPlayer(){currentPlayerId=null;renderPlayerSelect();showScreen('playerScreen')}
function renderPlayerSelect(){/* 起動時はプレイヤー選択だけ。プレイヤー依存処理をここではしない */}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rekishi-tanken-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.players||!x.players.p1||!x.players.p2)throw Error();state=x;save();alert('読み込みました。プレイヤー選択に戻ります。');switchPlayer()}catch(err){alert('このバックアップは読み込めませんでした。')}};r.readAsText(f)}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
load();renderPlayerSelect();
if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});
</script></body></html>
